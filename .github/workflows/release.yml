name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Build and package only; do not publish or create a release."
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run check-types

      - run: npm run compile-tests

      - name: Test
        run: xvfb-run -a npm test

      # A tag push must match the version in package.json, so the Marketplace
      # version and the Git tag never drift apart.
      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Package
        run: npx --yes @vscode/vsce package --out "albuddy-${GITHUB_REF_NAME:-dev}.vsix"

      - name: Publish to Visual Studio Marketplace
        if: startsWith(github.ref, 'refs/tags/') && !inputs.dry-run
        run: npx --yes @vscode/vsce publish --packagePath albuddy-*.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/') && !inputs.dry-run
        uses: softprops/action-gh-release@v3
        with:
          files: albuddy-*.vsix
          generate_release_notes: true
          fail_on_unmatched_files: true

      - uses: actions/upload-artifact@v7
        with:
          name: albuddy-vsix
          path: albuddy-*.vsix
